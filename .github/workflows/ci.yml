name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN — R1-2 ("Protect Aave API Boundary +
# Least-Privilege CI"). This job only checks out the repository to lint,
# type-check, test, and build; it never writes back to GitHub (no
# comments, no releases, no pushed commits), so it needs no more than
# read access to repository contents. Without this block the token
# would fall back to whatever the repository/organization default
# grants, which may be broader than this job actually uses. Matches
# `aave-v4-boundary.yml`'s own identical `permissions: contents: read`,
# applied here for the same reason.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
