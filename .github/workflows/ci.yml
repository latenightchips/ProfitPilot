name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN — R1-2 ("Protect Aave API Boundary +
# Least-Privilege CI"). This job only checks out the repository to lint,
# type-check, test, and build; it never writes back to GitHub (no
# comments, no releases, no pushed commits), so it needs no more than
# read access to repository contents. Without this block the token
# would fall back to whatever the repository/organization default
# grants, which may be broader than this job actually uses. Matches
# `aave-v4-boundary.yml`'s own identical `permissions: contents: read`,
# applied here for the same reason.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Production smoke gate — R1-3 ("Runtime Pinning + Production CI
      # Smoke Gate"). Closes the R1-1 finding that a passing `pnpm build`
      # was never actually verified to boot and serve anything. Installs
      # only Chromium (the one browser `playwright.config.ts`'s own
      # `projects` array defines) plus its OS-level dependencies — not
      # the full Firefox/WebKit matrix `pnpm test:e2e`'s broader,
      # non-blocking local suite could use.
      - name: Install Playwright Chromium (production smoke gate only)
        run: pnpm exec playwright install --with-deps chromium

      # Runs `pnpm start` against the build produced above (via
      # `playwright.config.ts`'s own `webServer` block — bounded by its
      # explicit 60s timeout, with guaranteed process cleanup after this
      # step regardless of outcome) and exercises exactly
      # `tests/e2e/productionSmoke.spec.ts`, not the full E2E suite. Makes
      # no live external network call — see that file's own header
      # comment for why. Network-dependent Aave V4 boundary verification
      # stays in its own separate, scheduled `aave-v4-boundary.yml`.
      - name: Production smoke test
        run: pnpm exec playwright test tests/e2e/productionSmoke.spec.ts
